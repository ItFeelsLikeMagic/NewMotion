name: NewMotion

options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    ARCHS: arm64
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CLANG_ENABLE_MODULES: YES
    SWIFT_EMIT_LOC_STRINGS: NO

configs:
  Debug: debug
  Release: release

targets:
  NewMotionShared:
    type: framework
    platform: [iOS, macOS]
    sources:
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.davidliao.newmotion.shared
        PRODUCT_NAME: NewMotionShared
        DEFINES_MODULE: YES
        ENABLE_TESTABILITY: YES
        GENERATE_INFOPLIST_FILE: YES
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        LD_DYLIB_INSTALL_NAME: "@rpath/NewMotionShared.framework/NewMotionShared"
        SKIP_INSTALL: YES
        BUILD_LIBRARY_FOR_DISTRIBUTION: NO

  NewMotion-iOS:
    type: application
    platform: iOS
    sources:
      - path: iPhone
    dependencies:
      - target: NewMotionShared
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.davidliao.newmotion.ios
        PRODUCT_MODULE_NAME: NewMotion_iOS
        PRODUCT_NAME: NewMotion
        INFOPLIST_FILE: Config/iPhone-Info.plist
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_IDENTITY: ""
        ENABLE_TESTABILITY: YES

  NewMotion-macOS:
    type: application
    platform: macOS
    sources:
      - path: Mac
    dependencies:
      - target: NewMotionShared
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.davidliao.newmotion.macos
        PRODUCT_MODULE_NAME: NewMotion_macOS
        PRODUCT_NAME: NewMotion
        INFOPLIST_FILE: Config/Mac-Info.plist
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/Frameworks"
        CODE_SIGN_IDENTITY: ""
        # Notarization refuses a build without it, and nothing here needs an
        # exception: no JIT, no unsigned memory, and the only bundled code is
        # our own framework, signed by the same team.
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_DEBUG_DYLIB: NO
        ENABLE_TESTABILITY: YES

  NewMotionSharedTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/Shared
    dependencies:
      - target: NewMotionShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.davidliao.newmotion.shared-tests
        PRODUCT_NAME: NewMotionSharedTests
        TEST_HOST: ""
        GENERATE_INFOPLIST_FILE: YES
        # No test host to embed the framework, so the bundle loads it from the
        # build products directory three levels above the executable.
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @loader_path/../../.."

  NewMotion-iOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/iOS
    dependencies:
      - target: NewMotion-iOS
      - target: NewMotionShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.davidliao.newmotion.ios-tests
        PRODUCT_NAME: NewMotioniOSTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/NewMotion.app/NewMotion"
        BUNDLE_LOADER: "$(TEST_HOST)"

  NewMotion-macOSTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/macOS
    dependencies:
      - target: NewMotion-macOS
      - target: NewMotionShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.davidliao.newmotion.macos-tests
        PRODUCT_NAME: NewMotionMacTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/NewMotion.app/Contents/MacOS/NewMotion"
        BUNDLE_LOADER: "$(TEST_HOST)"
