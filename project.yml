name: PhoneRemote

options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    ARCHS: arm64
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CLANG_ENABLE_MODULES: YES
    SWIFT_EMIT_LOC_STRINGS: NO

configs:
  Debug: debug
  Release: release

targets:
  PhoneRemoteShared:
    type: framework
    platform: [iOS, macOS]
    sources:
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.phoneremote.shared
        PRODUCT_NAME: PhoneRemoteShared
        DEFINES_MODULE: YES
        ENABLE_TESTABILITY: YES
        GENERATE_INFOPLIST_FILE: YES
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        LD_DYLIB_INSTALL_NAME: "@rpath/PhoneRemoteShared.framework/PhoneRemoteShared"
        SKIP_INSTALL: YES
        BUILD_LIBRARY_FOR_DISTRIBUTION: NO

  PhoneRemote-iOS:
    type: application
    platform: iOS
    sources:
      - path: iPhone
    dependencies:
      - target: PhoneRemoteShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.phoneremote.ios
        PRODUCT_MODULE_NAME: PhoneRemote_iOS
        PRODUCT_NAME: PhoneRemote
        INFOPLIST_FILE: Config/iPhone-Info.plist
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_IDENTITY: ""
        ENABLE_TESTABILITY: YES

  PhoneRemote-macOS:
    type: application
    platform: macOS
    sources:
      - path: Mac
    dependencies:
      - target: PhoneRemoteShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.phoneremote.macos
        PRODUCT_MODULE_NAME: PhoneRemote_macOS
        PRODUCT_NAME: PhoneRemoteMac
        INFOPLIST_FILE: Config/Mac-Info.plist
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/Frameworks"
        CODE_SIGN_IDENTITY: ""
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_DEBUG_DYLIB: NO
        ENABLE_TESTABILITY: YES

  PhoneRemoteSharedTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/Shared
    dependencies:
      - target: PhoneRemoteShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.phoneremote.shared-tests
        PRODUCT_NAME: PhoneRemoteSharedTests
        TEST_HOST: ""
        GENERATE_INFOPLIST_FILE: YES

  PhoneRemote-iOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/iOS
    dependencies:
      - target: PhoneRemote-iOS
      - target: PhoneRemoteShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.phoneremote.ios-tests
        PRODUCT_NAME: PhoneRemoteiOSTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PhoneRemote.app/PhoneRemote"
        BUNDLE_LOADER: "$(TEST_HOST)"

  PhoneRemote-macOSTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/macOS
    dependencies:
      - target: PhoneRemote-macOS
      - target: PhoneRemoteShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.phoneremote.macos-tests
        PRODUCT_NAME: PhoneRemoteMacTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PhoneRemoteMac.app/Contents/MacOS/PhoneRemoteMac"
        BUNDLE_LOADER: "$(TEST_HOST)"
