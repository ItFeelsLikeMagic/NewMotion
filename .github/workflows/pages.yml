# Publishes install.sh to GitHub Pages so the one-liner has a stable, short URL
# that never mentions a branch, and privacy.html and support.html so the App
# Store listing has stable privacy policy and support URLs. The files here are copies of the ones in the repo
# root; those root copies stay the only ones anyone edits.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - install.sh
      - privacy.html
      - support.html
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          mkdir -p site
          cp install.sh site/install.sh
          cp privacy.html site/privacy.html
          cp support.html site/support.html
          cat > site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>NewMotion</title>
          <meta http-equiv="refresh" content="0; url=https://github.com/davlia/NewMotion">
          <a href="https://github.com/davlia/NewMotion">NewMotion</a>
          HTML

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
